name: Deploy via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🔗 Conectando ao servidor..."
            PROJECT_PATH="/mnt/c/Users/marce/Onedrive/Área de Trabalho/ngrock-test"

            # Protege contra erro de espaço ou acento
            cd "$PROJECT_PATH" || { echo "❌ Falha ao acessar o diretório"; exit 1; }

            echo "📦 Executando deploy..."
            chmod +x deploy.sh
            ./deploy.sh

            echo "✅ Deploy concluído com sucesso!"
